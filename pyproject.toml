[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "1.0.0"
description = "文件整理工具：按日期归类、查找删除重复文件、批量重命名"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "wangy"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "xxhash>=3.0.0",
    "Pillow>=10.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
fileorg = "file_organizer.cli:app"

[tool.setuptools.packages.find]
include = ["file_organizer*"]
